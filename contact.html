<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ALMINGO S.L.</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
    <!-- Header -->
    <header class="cabecera">
        <div class="contenedor-cabecera">
            <div class="logo">
                <span class="icono-logo">💻</span>
                <span class="texto-logo">ALMINGO S.L.</span>
            </div>
            
            <nav class="menu-navegacion">
                <a href="index2.html" class="enlace-menu">Home</a>
                <a href="services.html" class="enlace-menu">Services</a>
                <a href="about-us.html" class="enlace-menu">About Us</a>
                <a href="contact.html" class="enlace-menu activo">Contact</a>
            </nav>

            <a href="contacto.html" class="boton-idioma">
                <span class="icono-idioma">🌐</span>
                <span>ES</span>
            </a>
        </div>
    </header>

    <!-- Contact Hero -->
    <section class="hero-contacto">
        <div class="contenedor-hero">
            <h1 class="titulo-pagina">Get in Touch</h1>
            <p class="subtitulo-pagina">We're here to help you turn your ideas into reality</p>
        </div>
    </section>

    <!-- Main Contact Section -->
    <section class="seccion-contacto-principal">
        <div class="contenedor-contacto">
            <!-- Contact Form -->
            <div class="tarjeta-formulario">
                <h2 class="titulo-formulario">Send Us a Message</h2>
                <form class="formulario-contacto" id="formularioContacto">
                    <div class="grupo-input">
                        <label for="nombre" class="etiqueta-input">Full Name *</label>
                        <input type="text" id="nombre" name="nombre" class="campo-input" required placeholder="Juan Pérez">
                    </div>

                    <div class="grupo-input">
                        <label for="email" class="etiqueta-input">Email *</label>
                        <input type="email" id="email" name="email" class="campo-input" required placeholder="juan@empresa.com">
                    </div>

                    <div class="grupo-input">
                        <label for="telefono" class="etiqueta-input">Phone</label>
                        <input type="tel" id="telefono" name="telefono" class="campo-input" placeholder="+34 600 000 000">
                    </div>

                    <div class="grupo-input">
                        <label for="empresa" class="etiqueta-input">Company</label>
                        <input type="text" id="empresa" name="empresa" class="campo-input" placeholder="Your company name">
                    </div>

                    <div class="grupo-input">
                        <label for="servicio" class="etiqueta-input">Service of Interest</label>
                        <select id="servicio" name="servicio" class="campo-select">
                            <option value="">Select a service</option>
                            <option value="software">Software Development</option>
                            <option value="movil">Mobile Applications</option>
                            <option value="web">Web Development</option>
                            <option value="bbdd">Databases</option>
                            <option value="consultoria">IT Consulting</option>
                            <option value="gamificacion">Gamification</option>
                            <option value="otro">Other</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="presupuesto" class="etiqueta-input">Estimated Budget</label>
                        <select id="presupuesto" name="presupuesto" class="campo-select">
                            <option value="">Select a range</option>
                            <option value="5k">Under €5,000</option>
                            <option value="10k">€5,000 - €10,000</option>
                            <option value="25k">€10,000 - €25,000</option>
                            <option value="50k">€25,000 - €50,000</option>
                            <option value="50k+">Over €50,000</option>
                        </select>
                    </div>

                    <div class="grupo-input-completo">
                        <label for="mensaje" class="etiqueta-input">Message *</label>
                        <textarea id="mensaje" name="mensaje" class="campo-textarea" rows="6" required placeholder="Tell us about your project..."></textarea>
                    </div>

                    <div class="grupo-checkbox">
                        <input type="checkbox" id="privacidad" name="privacidad" required>
                        <label for="privacidad" class="etiqueta-checkbox">
                            I accept the <a href="#" class="enlace-privacidad">privacy policy</a> and the processing of my data
                        </label>
                    </div>

                    <button type="submit" class="boton-enviar">
                        <span>Send Message</span>
                        <span class="icono-enviar">📧</span>
                    </button>

                    <p class="texto-ayuda">* Required fields</p>
                </form>
            </div>

          
</body>
</html>
