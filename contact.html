<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ALMINGO S.L.</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor-cabecera">
            <div class="logo">
                <span class="icono-logo">💼</span>
                <span class="texto-logo">ALMINGO S.L.</span>
            </div>
            
            <nav class="menu-navegacion">
                <a href="index2.html" class="enlace-menu">Home</a>
                <a href="services.html" class="enlace-menu">Services</a>
                <a href="about-us.html" class="enlace-menu">About Us</a>
                <a href="contact.html" class="enlace-menu activo">Contact</a>
            </nav>

            <a href="contacto.html" class="boton-idioma">
                <span class="icono-idioma">🇪🇸</span>
                <span>ES</span>
            </a>
        </div>
    </header>

    <section class="hero-contacto">
        <div class="contenedor-hero">
            <h1 class="titulo-pagina">Business Contact</h1>
            <p class="subtitulo-pagina">Request information about our professional services</p>
        </div>
    </section>

    <section class="seccion-contacto-principal">
        <div class="contenedor-contacto">
            <div class="tarjeta-formulario">
                <h2 class="titulo-formulario">Contact Form</h2>
                <form class="formulario-contacto" id="formularioContacto">
                    <div class="grupo-input">
                        <label for="nombre" class="etiqueta-input">Full Name *</label>
                        <input type="text" id="nombre" name="nombre" class="campo-input">
                    </div>

                    <div class="grupo-input">
                        <label for="email" class="etiqueta-input">Corporate Email *</label>
                        <input type="email" id="email" name="email" class="campo-input" required>
                    </div>

                    <div class="grupo-input">
                        <label for="telefono" class="etiqueta-input">Contact Phone *</label>
                        <input type="tel" id="telefono" name="telefono" class="campo-input" required>
                    </div>

                    <div class="grupo-input">
                        <label for="empresa" class="etiqueta-input">Company *</label>
                        <input type="text" id="empresa" name="empresa" class="campo-input" required>
                    </div>

                    <div class="grupo-input">
                        <label for="servicio" class="etiqueta-input">Area of Interest</label>
                        <select id="servicio" name="servicio" class="campo-select">
                            <option value="">Select a service</option>
                            <option value="software">Enterprise Software Development</option>
                            <option value="movil">Corporate Mobile Applications</option>
                            <option value="web">Corporate Web Development</option>
                            <option value="bbdd">Database Administration</option>
                            <option value="consultoria">IT Consulting</option>
                            <option value="elearning">E-Learning & Training</option>
                            <option value="otro">Other</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="presupuesto" class="etiqueta-input">Estimated Budget</label>
                        <select id="presupuesto" name="presupuesto" class="campo-select">
                            <option value="">Select a range</option>
                            <option value="5k">Under €10,000</option>
                            <option value="10k">€10,000 - €25,000</option>
                            <option value="25k">€25,000 - €50,000</option>
                            <option value="50k">€50,000 - €100,000</option>
                            <option value="100k+">Over €100,000</option>
                        </select>
                    </div>

                    <div class="grupo-input-completo">
                        <label for="mensaje" class="etiqueta-input">Project Description *</label>
                        <textarea id="mensaje" name="mensaje" class="campo-textarea" rows="6"></textarea>
                    </div>

                    <button type="submit" class="boton-enviar">
                        <span>Submit Request</span>
                        <span class="icono-enviar">✔️</span>
                    </button>

                    
                </form>
            </div>

          
</body>
</html>
