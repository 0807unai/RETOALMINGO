<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - ALMINGO S.L.</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
    <!-- Encabezado -->
    <header class="cabecera">
        <div class="contenedor-cabecera">
            <div class="logo">
                <span class="icono-logo">💼</span>
                <span class="texto-logo">ALMINGO S.L.</span>
            </div>
            
            <nav class="menu-navegacion">
                <a href="index.html" class="enlace-menu">Inicio</a>
                <a href="servicios.html" class="enlace-menu">Servicios</a>
                <a href="sobre-nosotros.html" class="enlace-menu">Sobre Nosotros</a>
                <a href="contacto.html" class="enlace-menu activo">Contacto</a>
            </nav>

            <a href="contact.html" class="boton-idioma">
                <span class="icono-idioma">🇬🇧</span>
                <span>EN</span>
            </a>
        </div>
    </header>

    <!-- Hero de Contacto -->
    <section class="hero-contacto">
        <div class="contenedor-hero">
            <h1 class="titulo-pagina">Contacto Empresarial</h1>
            <p class="subtitulo-pagina">Solicite información sobre nuestros servicios profesionales</p>
        </div>
    </section>

    <!-- Sección Principal de Contacto -->
    <section class="seccion-contacto-principal">
        <div class="contenedor-contacto">
            <!-- Formulario de Contacto -->
            <div class="tarjeta-formulario">
                <h2 class="titulo-formulario">Formulario de Contacto</h2>
                <form class="formulario-contacto" id="formularioContacto">
                    <div class="grupo-input">
                        <label for="nombre" class="etiqueta-input">Nombre y Apellidos *</label>
                        <input type="text" id="nombre" name="nombre" class="campo-input" required placeholder="Nombre completo">
                    </div>

                    <div class="grupo-input">
                        <label for="email" class="etiqueta-input">Email Corporativo *</label>
                        <input type="email" id="email" name="email" class="campo-input" required placeholder="nombre@empresa.com">
                    </div>

                    <div class="grupo-input">
                        <label for="telefono" class="etiqueta-input">Teléfono de Contacto *</label>
                        <input type="tel" id="telefono" name="telefono" class="campo-input" required placeholder="+34 600 000 000">
                    </div>

                    <div class="grupo-input">
                        <label for="empresa" class="etiqueta-input">Empresa *</label>
                        <input type="text" id="empresa" name="empresa" class="campo-input" required placeholder="Nombre de su empresa">
                    </div>

                    <div class="grupo-input">
                        <label for="servicio" class="etiqueta-input">Área de Interés</label>
                        <select id="servicio" name="servicio" class="campo-select">
                            <option value="">Seleccione un servicio</option>
                            <option value="software">Desarrollo Software Empresarial</option>
                            <option value="movil">Aplicaciones Móviles Corporativas</option>
                            <option value="web">Desarrollo Web Corporativo</option>
                            <option value="bbdd">Administración Bases de Datos</option>
                            <option value="consultoria">Consultoría IT</option>
                            <option value="elearning">E-Learning y Formación</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="presupuesto" class="etiqueta-input">Presupuesto Estimado</label>
                        <select id="presupuesto" name="presupuesto" class="campo-select">
                            <option value="">Seleccione un rango</option>
                            <option value="10k">10.000€ - 25.000€</option>
                            <option value="25k">25.000€ - 50.000€</option>
                            <option value="50k">50.000€ - 100.000€</option>
                            <option value="100k+">Más de 100.000€</option>
                        </select>
                    </div>

                    <div class="grupo-input-completo">
                        <label for="mensaje" class="etiqueta-input">Descripción del Proyecto *</label>
                        <textarea id="mensaje" name="mensaje" class="campo-textarea" rows="6" required placeholder="Describa brevemente su proyecto o necesidades tecnológicas..."></textarea>
                    </div>

                    <div class="grupo-checkbox">
                        <input type="checkbox" id="privacidad" name="privacidad" required>
                        <label for="privacidad" class="etiqueta-checkbox">
                            Acepto la <a href="#" class="enlace-privacidad">política de privacidad</a> y el tratamiento de mis datos conforme al RGPD
                        </label>
                    </div>

                    <button type="submit" class="boton-enviar">
                        <span>Enviar Solicitud</span>
                        <span class="icono-enviar">📧</span>
                    </button>

                    <p class="texto-ayuda">* Campos obligatorios. Recibirá respuesta en un plazo máximo de 24 horas laborables</p>
                </form>
            </div>

          
</body>
</html>
